name: Quality checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sumi
          POSTGRES_DB: sumi_test
          POSTGRES_PASSWORD: test-only-ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sumi -d sumi_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run smoke
      - name: PostgreSQL integration suite (isolated disposable CI database)
        run: npm test
        env:
          TEST_DATABASE_URL: postgresql://sumi:test-only-ci-password@localhost:5432/sumi_test
          DATABASE_URL: postgresql://sumi:test-only-ci-password@localhost:5432/sumi_test
      - run: npm audit --omit=dev --audit-level=moderate
      - name: Validate container build
        run: docker build -t sumi:ci .
