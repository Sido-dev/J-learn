<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sumi development verification</title><style>body{font:16px/1.6 Arial;margin:30px;background:#ede9df;color:#273447}button,select{padding:14px;margin:10px;font:inherit}pre{white-space:pre-wrap;background:white;padding:20px;border-radius:8px}iframe{display:block;height:900px;border:1px solid #999;background:white;transform-origin:top left}#viewport{max-width:100%;overflow:auto}table{border-collapse:collapse;background:white}td,th{padding:8px;border:1px solid #ccc}a{color:#273447}</style></head><body><h1>Sumi development verification</h1><p>Same-origin iframe verification. Test data stays in this local preview. The QA page is excluded from production builds.</p><label>Suite<select id="suite"><option value="core">Core screens</option><option value="lessons">Lessons and reader</option><option value="upgrade">Upgraded practice / reference</option><option value="sessions">Saved session views</option><option value="selected">Selected screen only</option></select></label><button id="run" disabled>Run responsive and accessibility checks</button><label>Inspect width<select id="width"><option>320</option><option>375</option><option>768</option><option>1024</option><option selected>1440</option><option>1920</option></select></label><label>Screen<select id="screen"><option>home</option><option>path</option><option>reading</option><option>writing</option><option>audio</option><option>reference</option><option>progress</option><option>settings</option><option>lesson-register</option><option>quiz-marks</option><option>quiz-identity</option><option>quiz-objects</option><option>quiz-listen-vowels</option><option>reader-tea</option><option>quiz</option><option>guide-h-a</option><option>reference-kanji</option><option>reference-mountain</option><option>reference-word</option><option>reference-grammar</option><option>practice-active</option><option>practice-
