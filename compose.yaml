services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: sumi
      POSTGRES_DB: sumi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a long unique database password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sumi -d sumi"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  migrate:
    build: .
    command: ["node", "dist/migrate.js"]
    environment:
      DATABASE_URL: postgresql://sumi:${POSTGRES_PASSWORD}@db:5432/sumi
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  app:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      APP_ORIGIN: ${APP_ORIGIN:?Set the exact HTTPS application origin}
      DATABASE_URL: postgresql://sumi:${POSTGRES_PASSWORD}@db:5432/sumi
      TRUST_PROXY_HOPS: "1"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
volumes:
  postgres_data:
